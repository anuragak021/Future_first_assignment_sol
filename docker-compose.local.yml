version: "3.9"

# Self-contained local stack — no Postgres or ChromaDB needed.
# SQLite + embedded Chroma are baked into the backend image (same as Railway).
#
# First run (builds image with model downloads + seeding): ~10-15 min
# Subsequent runs (cached): ~30 sec
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build
#
# Requires OPENROUTER_API_KEY in your .env file.

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      USE_SQLITE: "true"
      USE_EMBEDDED_CHROMA: "true"
      SQLITE_PATH: /app/insights.db
      CHROMA_PERSIST_DIR: /app/chroma_data
      APP_ENV: production
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "80"
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
