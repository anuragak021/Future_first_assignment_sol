app:
  name: secure-ai-insights
  version: "1.0.0"
  env: ${APP_ENV:development}

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  supervisor_temperature: 0.2
  synthesizer_temperature: 0.5
  verifier_temperature: 0.0

embedding:
  model: BAAI/bge-small-en-v1.5
  device: cpu

reranker:
  model: BAAI/bge-reranker-base
  device: cpu

retrieval:
  top_k: 4
  rerank_top_n: 20
  mmr_lambda: 0.5
  chunk_size: 512
  chunk_overlap: 64

verifier:
  max_retries: 2
  numeric_tolerance: 0

db:
  query_timeout_ms: 3000
  max_rows: 10000

eval:
  noise_chunks: 0  # set to 2 in eval mode

observability:
  log_level: ${LOG_LEVEL:INFO}
  trace_db: trace_store.db
